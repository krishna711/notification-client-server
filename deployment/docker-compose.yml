version: '3.8'

services:
  notification-gateway:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: notification_gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Central Notification Gateway
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_PATH=/data/notifications.db
      - NOTIFICATION_API_KEYS=your-production-secret-key-1,trading-app-key
      - DEVICE_AUTH_TOKEN=your-production-device-secret-token
    volumes:
      - gateway_data:/data

  # Optional Cloudflare Tunnel container (runs tunnel right next to the app)
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: cloudflared_tunnel
  #   restart: unless-stopped
  #   command: tunnel run
  #   environment:
  #     - TUNNEL_TOKEN=YOUR_CLOUDFLARE_ZERO_TRUST_TUNNEL_TOKEN
  #   depends_on:
  #     - notification-gateway

volumes:
  gateway_data:
    driver: local
